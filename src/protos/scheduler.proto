syntax = "proto3";
package scheduler;

service Scheduler {
    rpc GenerateSchedule (ScheduleRequest) returns (ScheduleResponse) {}
}

message ScheduleRequest {
    repeated Team league = 1;
    repeated Division divisions = 2;
    Options options = 3;
}

message Options {
    bool in_division_play_twice = 1;
    bool out_of_division_play_once = 2;
    int32 num_weeks = 3;
}

message Team {
    string name = 1;
    int64 division_id = 2;
}

message Division {
    string name = 1;
    int64 id = 2;
}

message ScheduleResponse {
    repeated WeeklyMatchups matchups = 1;
}

message WeeklyMatchups {
    repeated Matchup matchups = 1;
}

message Matchup {
    Team team1 = 1;
    Team team2 = 2;
}

