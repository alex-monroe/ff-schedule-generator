name: Publish Protos to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/protos/**'
    tags:
      - 'npm-v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: npm
        run: npm install

      - name: Compile TypeScript protos
        working-directory: npm
        run: npm run build

      - name: Bump package version
        working-directory: npm
        run: npm version patch --no-git-tag-version

      - name: Publish package
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create pull request for version bump
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump npm package version"
          title: "chore: bump npm package version"
          body: Automated version bump after publishing to npm.
          branch: npm-version-bump-${{ github.run_id }}
          base: main
          add-paths: |
            npm/package.json
            npm/package-lock.json
          delete-branch: true
