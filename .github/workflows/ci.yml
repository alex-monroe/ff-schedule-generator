name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nox

      - name: Run lint
        run: nox -s lint

      - name: Run unit tests
        run: nox -s test_unit

      - name: Run integration tests
        run: nox -s test_integration

      - name: Build server
        run: nox -s build
